name: Refresh competitor signals

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Capture public sources
        run: python3 scripts/capture/capture_sources.py --days 365

      - name: Merge signals
        run: |
          python3 scripts/merge_signals.py \
            --raw data/raw/latest.json \
            --raw data/raw/linkedin_latest.json

      - name: Commit refreshed dashboard data
        run: |
          git config user.name "competitor-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/signals.json
          git commit -m "Refresh competitor signals" || exit 0
          git push
