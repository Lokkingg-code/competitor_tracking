name: competitor-tracking-searxng

services:
  searxng:
    image: docker.io/searxng/searxng:${SEARXNG_VERSION:-latest}
    container_name: competitor-tracking-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?Use scripts/capture/searxng_local.sh to create the local secret}
      SEARXNG_BASE_URL: http://localhost:8080/
      SEARXNG_VALKEY_URL: valkey://valkey:6379/0
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
      - searxng-cache:/var/cache/searxng
    depends_on:
      - valkey

  valkey:
    image: docker.io/valkey/valkey:9-alpine
    container_name: competitor-tracking-searxng-valkey
    restart: unless-stopped
    command: valkey-server --save 30 1 --loglevel warning
    volumes:
      - valkey-data:/data

volumes:
  searxng-cache:
  valkey-data:
